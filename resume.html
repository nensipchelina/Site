let currentLang = 'ru';

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('np-lang', lang);
  const d = data[lang];

  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.toLowerCase()===lang||(lang==='zh'&&b.textContent==='中文'));
  });

  // i18n text elements
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    if (d[k] && typeof d[k]==='string') el.textContent = d[k];
  });

  // Page name HTML
  document.getElementById('page-name').innerHTML = d.name_html;

  // CV card
  document.getElementById('cv-name').textContent = d.name;
  document.getElementById('cv-job').textContent = d.job;
  document.getElementById('cv-monogram').textContent = d.monogram;
  document.getElementById('cv-summary').textContent = d.summary;

  // Brands in left strip
  document.getElementById('cv-brands-left').textContent =
    'Vincult, Franky, Vertango, Pachkoriya, ' +
    (lang==='ru'?'Дом музыки':'Dom Muzyki') +
    ', KraftiShop, Edinovlastie';

  // Skills
  document.getElementById('cv-skills').innerHTML = d.skills.map(([name, level]) => `
    <div class="cv-skill-row">
      <span class="cv-skill-name">${name}</span>
      <span class="cv-skill-level">${level}</span>
    </div>
  `).join('');

  // Experience
  document.getElementById('cv-exp').innerHTML = d.exp.map(([yr, title, desc]) => `
    <div class="cv-exp-item">
      <div class="cv-exp-year">${yr}</div>
      <div>
        <div class="cv-exp-title">${title}</div>
        <div class="cv-exp-desc">${desc}</div>
      </div>
    </div>
  `).join('');

  // PDF download button
  const pdfBtn = document.getElementById('pdf-download-btn');
  if (pdfBtn) { pdfBtn.href = d.pdf_file; pdfBtn.download = d.pdf_file; }

  // Price link
  const priceLink = document.getElementById('price-link');
  if (priceLink) priceLink.href = 'price.html?lang=' + lang;
}
